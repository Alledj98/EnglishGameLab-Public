<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#15162b">
  <meta name="description" content="English Game Lab — giochi ed esercizi di inglese per la classe.">
  <title>English Game Lab</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <!-- Firebase client SDK. Authentication happens in the browser; all school data is served by the protected API. -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="/firebase-config.js"></script>
  <script>
    firebase.initializeApp(window.EGL_FIREBASE_CONFIG);
    window.eglAuth = firebase.auth();
    window.eglAuthPersistenceReady = window.eglAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});
    window.eglAuthReady = new Promise(resolve => {
      const off = window.eglAuth.onAuthStateChanged(() => { off(); resolve(); });
    });
  </script>
  <script src="/bulk-content.js"></script>
  <script src="/teacher-prompt.js"></script>
  <script src="/app.js"></script>
</body>
</html>
